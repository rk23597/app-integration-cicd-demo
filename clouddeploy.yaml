apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: appint-sample-pipeline
serialPipeline:
  stages:
  - targetId: dev
  - targetId: qa
  - targetId: prod
---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev
customTarget:
  customTargetType: appint-sample-target
deployParameters:
  APP_INTEGRATION_PROJECT_ID: "apigee-ai" #dev Project ID
  APP_INTEGRATION_REGION: "us-east1" #dev region
---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: qa
customTarget:
  customTargetType: appint-sample-target
deployParameters:
  APP_INTEGRATION_PROJECT_ID: "bap-amer-coe-demo1" #qa Project ID
  APP_INTEGRATION_REGION: "us-west1" #qa region
---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod
customTarget:
  customTargetType: appint-sample-target
deployParameters:
  APP_INTEGRATION_PROJECT_ID: "bap-amer-coe-demo1" #prod Project ID
  APP_INTEGRATION_REGION: "us-west1" #prod region
---

apiVersion: deploy.cloud.google.com/v1
kind: CustomTargetType
metadata:
  name: appint-sample-target
customActions:
  renderAction: render-sample-integration
  deployAction: deploy-sample-integration